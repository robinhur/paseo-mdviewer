name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generated files match their sources
        run: |
          npm run build
          git diff --exit-code -- server/generated THIRD_PARTY_NOTICES.md
      - name: Browser tests
        run: |
          npx playwright-core install --with-deps chromium
          CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" npm run test:browser
